<div id="loginScreen" class="hidden">
    <div class="login-card">
      <div class="login-logo">
        <img class="logo-img" src="./logo.png" alt="Logo RS Puri Cinere">
      </div>
      <h1>LAPORAN HARIAN IPSRS</h1>
      <div class="sub">RS. Puri Cinere &middot; Login petugas internal</div>

      <label for="loginUsername">Username</label>
      <input id="loginUsername" type="text" placeholder="contoh: petugas01" autocomplete="username">

      <label for="loginPassword">Password</label>
      <div class="ipsrs-password-wrap" style="position:relative;width:100%;">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding-right:52px;box-sizing:border-box;">
        <button id="togglePassword" type="button" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan password" onclick="(function(btn){var i=document.getElementById('loginPassword');if(!i)return;var show=i.type==='password';i.type=show?'text':'password';btn.setAttribute('aria-pressed',show?'true':'false');btn.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');btn.setAttribute('title',show?'Sembunyikan password':'Tampilkan password');})(this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#64748b;">
          <svg id="passwordEyeIcon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <label class="remember-row" for="loginRemember">
        <input id="loginRemember" type="checkbox">
        <span>Ingat saya di perangkat ini</span>
      </label>

      <style>
        .login-submit{
          transition:background-color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .12s ease;
        }
        .login-submit:hover{
          background:var(--success) !important;
          border-color:var(--success) !important;
          color:#fff !important;
          box-shadow:0 6px 18px rgba(26,158,87,.28);
          transform:translateY(-1px);
        }
        .login-submit:active{
          transform:translateY(0);
          box-shadow:0 3px 10px rgba(26,158,87,.22);
        }
      </style>
      <button class="btn primary lg block login-submit" style="margin-top:var(--sp-5);" onclick="doLogin()">Masuk</button>
      <div id="loginMsg"></div>
    </div>
  </div>
