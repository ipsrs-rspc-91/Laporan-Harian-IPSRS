<section id="page-input" class="page active">\n<style>
  #page-input .status-choice-group{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:6px;
  }
  #page-input .status-choice{
    appearance:none;
    width:100%;
    min-height:54px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:#fff;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:12px 14px;
    font:inherit;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;
  }
  #page-input .status-choice:hover{
    border-color:var(--text-muted);
  }
  #page-input .status-choice-icon{
    font-size:20px;
    line-height:1;
  }
  #page-input .status-choice-belum.is-selected{
    background:#fff1f2;
    border-color:#fca5a5;
    color:#b91c1c;
    box-shadow:0 0 0 1px rgba(185,28,28,.05);
  }
  #page-input .status-choice-selesai.is-selected{
    background:#f0fdf4;
    border-color:#86efac;
    color:#166534;
    box-shadow:0 0 0 1px rgba(22,101,52,.05);
  }
  #page-input .status-choice:disabled{
    cursor:not-allowed;
    opacity:.65;
  }
  @media (max-width:480px){
    #page-input .status-choice{min-height:50px;padding:10px 8px;}
  }
</style>

        <div class="page-header">
  <div>
    <h1 id="inputPageTitle">Input Laporan</h1>
    <div class="desc" id="inputPageDesc">Isi laporan kegiatan / perbaikan harian ini</div>
  </div>
  <div class="pill" id="inputIdentityPill">-</div>
</div>

<div class="card">
  <div id="inputPermissionNote" class="smallnote hidden" style="color:var(--danger); font-weight:700; margin-bottom:var(--sp-3);"></div>

  <div id="inputHistoryPanel" class="hidden" style="background:var(--primary-light); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:var(--sp-3);">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b style="font-size:var(--fs-sm); color:var(--primary-dark);">Riwayat Perubahan (khusus KA IPSRS &amp; Administrasi)</b>
      <button class="btn" style="padding:4px 10px; font-size:var(--fs-xs);" onclick="toggleHistoryList()">Tampilkan/Sembunyikan</button>
    </div>
    <div id="historyList" class="hidden" style="margin-top:var(--sp-2); max-height:220px; overflow-y:auto;"></div>
  </div>

  <div class="form-grid">
    <div>
      <label for="Tanggal">Tanggal</label>
      <input type="date" id="Tanggal">

      <label for="Pelapor">Pelapor</label>
      <input id="Pelapor" placeholder="Nama yang melapor">

      <div class="field-row">
        <div>
          <label for="Pukul">Pukul</label>
          <input id="Pukul" placeholder="HH:MM">
        </div>
        <div>
          <label for="NoLK">No LK</label>
          <input id="NoLK">
        </div>
      </div>

      <label for="Ruang">Ruang</label>
      <input id="Ruang" placeholder="Contoh: IGD, Ruang Anggrek">

      <label for="MasalahKegiatan">Masalah / Kegiatan</label>
      <textarea id="MasalahKegiatan" placeholder="Jelaskan masalah atau kegiatan"></textarea>

      <label for="Tindakan">Tindakan</label>
      <textarea id="Tindakan" placeholder="Tindakan yang dilakukan"></textarea>
    </div>

    <div>
      <label for="SparePartUnit">Spare Part / Unit</label>
      <input id="SparePartUnit">

      <label for="Type">Type</label>
      <input id="Type">

      <label for="Jumlah">Jumlah</label>
      <input id="Jumlah" type="number" min="0">

      <label for="Status">Status</label>
      <input type="hidden" id="Status" value="">
      <div class="status-choice-group" role="group" aria-label="Status pekerjaan">
        <button type="button" class="status-choice status-choice-belum" data-status="Belum" onclick="selectInputStatus('Belum')">
          <span class="status-choice-icon" aria-hidden="true">◷</span>
          <span>Belum</span>
        </button>
        <button type="button" class="status-choice status-choice-selesai" data-status="Selesai" onclick="selectInputStatus('Selesai')">
          <span class="status-choice-icon" aria-hidden="true">✓</span>
          <span>Selesai</span>
        </button>
      </div>
      <div class="smallnote">Pilih salah satu status pekerjaan.</div>

      <label for="Petugas">Petugas</label>
      <input id="Petugas" class="readonlyPetugas" readonly>
      <div class="smallnote">Otomatis terisi dari akun yang login &mdash; tidak dapat diubah manual.</div>

      <label for="Kategori">Kategori</label>
      <select id="Kategori" onchange="handleKategoriChange()"><option value="">Pilih kategori&hellip;</option></select>

      <label for="AreaKerja">Area Kerja</label>
      <select id="AreaKerja" onchange="handleAreaKerjaChange()"><option value="">Pilih area kerja&hellip;</option></select>

      <label for="Item">Item</label>
      <select id="Item" onchange="handleItemChange()"><option value="">Pilih area kerja dahulu&hellip;</option></select>

      <label for="Keterangan">Keterangan</label>
      <textarea id="Keterangan" placeholder="Catatan tambahan (opsional)"></textarea>
    </div>
  </div>

  <button id="btnSaveInput" class="btn accent lg block" style="margin-top:var(--sp-4);" onclick="saveData()">Simpan Laporan</button>
  <div id="msgInput" style="margin-top:var(--sp-2); font-size:var(--fs-base); font-weight:700;"></div>
</div>

      </section>
