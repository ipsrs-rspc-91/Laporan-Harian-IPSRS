  <script>
  (async function(){
    const initialMounts={loginScreen:'pages/Page_Login.html', 'page-input':'pages/Page_Input.html'};
    const deferredMounts={ 'page-dashboard':'pages/Page_Dashboard.html', 'page-laporan':'pages/Page_Laporan.html', 'page-online':'pages/Page_Online.html' };
    window.__ipsrsPageReady = window.__ipsrsPageReady || {};
    window.__ipsrsPageReady.dashboard = null;
    window.__ipsrsPageReady.laporan = null;
    window.__ipsrsPageReady.online = null;
    async function fragment(id,url){const el=document.getElementById(id);if(!el)throw new Error('Mount point not found: '+id);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Gagal memuat '+url+' ('+r.status+')');el.outerHTML=await r.text();const mounted=document.getElementById(id);const pageName=id.replace(/^page-/,'');const activeNav=document.querySelector('.nav-item.active');if(mounted&&mounted.classList.contains('page')&&activeNav&&activeNav.dataset.page===pageName)mounted.classList.add('active');return true;}
    function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Gagal memuat '+src));document.body.appendChild(s);});}
    try{
      await Promise.all(Object.entries(initialMounts).map(([id,url])=>fragment(id,url)));
      await script('js/static-data.js?v=20260916');
      await script('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js');
      await script('./config.js?v=SUPABASE-CUTOVER-20260923-3');
      await script('./app.js?v=20260926-SAVEMODAL1');
      await script('./required-fields-ui.js?v=20260923-PERF1');
      await script('./access-control.js?v=20260916');
      await script('./access-policy-ui.js?v=20260916');
      await script('./login-fast.js?v=20260924-PASSWORD7');
      await script('./dashboard-loading-v2.js?v=20260924-DASHFAST1');
      await script('./access-visibility-fix.js?v=20260923-PERF1');
      await script('./laporan-fast-v2.js?v=20260924-LAPORANRACEFIX2');
      await script('./laporan-loading-state.js?v=20260923-CONSISTENT1');
      window.__ipsrsPageReady.dashboard = fragment('page-dashboard', deferredMounts['page-dashboard']);
      window.__ipsrsPageReady.laporan = fragment('page-laporan', deferredMounts['page-laporan']);
      window.__ipsrsPageReady.online = fragment('page-online', deferredMounts['page-online']);
      Promise.all([window.__ipsrsPageReady.dashboard, window.__ipsrsPageReady.laporan, window.__ipsrsPageReady.online]).catch(e=>console.warn('Deferred page load:',e));
      window.__ipsrsChartReady = script('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js').catch(e=>{ console.warn('Deferred Chart.js load:', e); throw e; });
    }
    catch(e){console.error(e);const t=document.querySelector('.auth-loading-text');if(t)t.textContent='Gagal memuat aplikasi. Silakan muat ulang halaman.';}
  })();
  </script>
