name: Finalize IPSRS frontend split

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refactor current frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('frontend')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          # Extract the existing inline static master data into its own JS file.
          m = re.search(r'<script>\s*(const STATIC_KATEGORI\s*=.*?\n\s*const ITEMS_BY_AREA\s*=.*?\n\s*\};)\s*</script>', html, re.S)
          if not m:
              raise RuntimeError('Static data block not found')
          static_js = m.group(1).strip() + '\n'
          (root / 'js').mkdir(exist_ok=True)
          (root / 'js' / 'static-data.js').write_text(static_js, encoding='utf-8')
          html = html[:m.start()] + html[m.end():]

          # Remove the old Chart.js/config/app script tags. They are loaded in
          # dependency order by the bootstrap loader below.
          html = re.sub(r'\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/Chart\.js/4\.4\.0/chart\.umd\.min\.js"></script>', '', html)
          html = re.sub(r'\s*<script src="\./config\.js"></script>', '', html)
          html = re.sub(r'\s*<script src="\./app\.js"></script>', '', html)

          # Move report-related modals from the shell into Page_Laporan.html.
          modal_names = [
              'EDIT LAPORAN',
              'TAMBAH KATEGORI',
              'TAMBAH AREA KERJA',
              'TAMBAH ITEM',
              'KONFIRMASI SIMPAN',
          ]
          modal_blocks = []
          for name in modal_names:
              start_pat = r'\s*<!-- ===================== MODAL: ' + re.escape(name) + r' ===================== -->'
              sm = re.search(start_pat, html, re.I)
              if not sm:
                  raise RuntimeError('Modal not found: ' + name)
              # Find the next modal marker or the Chart.js marker.
              tail = html[sm.end():]
              nm = re.search(r'\s*<!-- ===================== MODAL: |\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/Chart\.js', tail)
              if not nm:
                  raise RuntimeError('End marker not found for modal: ' + name)
              block = html[sm.start():sm.end()+nm.start()].strip()
              modal_blocks.append(block)
              html = html[:sm.start()] + html[sm.end()+nm.start():]

          pages = root / 'pages'
          report_page = pages / 'Page_Laporan.html'
          report_html = report_page.read_text(encoding='utf-8').rstrip() + '\n\n' + '\n\n'.join(modal_blocks) + '\n'
          report_page.write_text(report_html, encoding='utf-8')

          # Remove any previous bootstrap loader and add one final loader.
          html = re.sub(r'\s*<script>\s*\(async function\(\)\{\s*const mounts = \{.*?\}\)\(\);\s*</script>\s*', '\n', html, flags=re.S)

          loader = r'''
  <script>
  (async function(){
    const mounts = {
      loginScreen: 'pages/Page_Login.html',
      'page-input': 'pages/Page_Input.html',
      'page-dashboard': 'pages/Page_Dashboard.html',
      'page-laporan': 'pages/Page_Laporan.html'
    };

    async function loadFragment(id, url){
      const el = document.getElementById(id);
      if(!el) throw new Error('Mount point not found: ' + id);
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('Gagal memuat ' + url + ' (' + res.status + ')');
      el.outerHTML = await res.text();
    }

    function loadScript(src){
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Gagal memuat script: ' + src));
        document.body.appendChild(s);
      });
    }

    try{
      // HTML pages can be downloaded in parallel; JS dependencies remain ordered.
      await Promise.all(Object.entries(mounts).map(([id,url]) => loadFragment(id,url)));
      await loadScript('js/static-data.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js');
      await loadScript('./config.js');
      await loadScript('./app.js');
    }catch(err){
      console.error(err);
      const loading = document.querySelector('.auth-loading-text');
      if(loading) loading.textContent = 'Gagal memuat aplikasi. Silakan muat ulang halaman.';
    }
  })();
  </script>
'''
          html = html.replace('</body>', loader + '</body>')
          index.write_text(html, encoding='utf-8')
          print('Final frontend split completed.')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html frontend/pages frontend/js/static-data.js
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: complete IPSRS frontend page split'
          git push
