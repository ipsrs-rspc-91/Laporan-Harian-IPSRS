name: Deploy IPSRS Supabase Backend

on:
  workflow_run:
    workflows: ["IPSRS Automated Audit Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: tcrmlhfsroyhaxdfwyll

jobs:
  deploy-supabase:
    name: Deploy Supabase Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "❌ Missing GitHub Secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy managed Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy ipsrs-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "✅ Supabase backend deployment completed"
