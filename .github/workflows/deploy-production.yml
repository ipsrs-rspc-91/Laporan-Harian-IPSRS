name: Deploy IPSRS Production

on:
  workflow_run:
    workflows: ["IPSRS Automated Audit Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipsrs-production
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: tcrmlhfsroyhaxdfwyll

jobs:
  deploy-supabase:
    name: Deploy Supabase Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "❌ Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy managed Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy ipsrs-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify Supabase deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "✅ Supabase backend deployment completed"

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker
        env:
          WORKER_URL: https://laporan-harian-ipsrs.rspc.workers.dev/
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/worker.html -w '%{http_code}' --max-time 30 "$WORKER_URL")" || code="000"
          if [ "$code" != "200" ]; then
            echo "❌ Cloudflare Worker smoke check failed: HTTP $code"
            exit 1
          fi
          echo "✅ Cloudflare Worker smoke check passed"

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment smoke check
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/ipsrs-index.html -w '%{http_code}' --max-time 20 "$SITE_URL")" || code="000"
            if [ "$code" = "200" ] && grep -q "LAPORAN HARIAN IPSRS" /tmp/ipsrs-index.html; then
              echo "✅ GitHub Pages smoke check passed"
              exit 0
            fi
            sleep 10
          done
          echo "❌ GitHub Pages smoke check failed"
          exit 1

  production-result:
    name: Production Deployment Gate
    needs: [deploy-supabase, deploy-cloudflare, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Block failed production deployment
        if: ${{ needs.deploy-supabase.result != 'success' || needs.deploy-cloudflare.result != 'success' || needs.deploy-pages.result != 'success' }}
        run: |
          echo "❌ IPSRS PRODUCTION DEPLOYMENT FAILED"
          echo "One or more production targets did not deploy successfully."
          exit 1

      - name: Production deployment passed
        run: echo "✅ IPSRS PRODUCTION DEPLOYMENT PASSED"
