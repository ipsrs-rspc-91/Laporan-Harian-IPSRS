name: Deploy IPSRS Production

on:
  workflow_run:
    workflows: ["IPSRS Automated Audit Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipsrs-production
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: tcrmlhfsroyhaxdfwyll

jobs:
  detect-changes:
    name: Detect deployment targets
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      supabase: ${{ steps.changes.outputs.supabase }}
      cloudflare: ${{ steps.changes.outputs.cloudflare }}
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect changed components
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only "${{ github.event.workflow_run.head_sha }}^" "${{ github.event.workflow_run.head_sha }}")"
          echo "Changed files:"
          printf '%s\n' "$files"

          frontend=false
          supabase=false
          cloudflare=false

          if printf '%s\n' "$files" | grep -q '^frontend/'; then
            frontend=true
          fi

          if printf '%s\n' "$files" | grep -q '^supabase/'; then
            supabase=true
          fi

          # Cloudflare Worker currently publishes ./frontend as its Worker assets.
          # Therefore a frontend change is also a Cloudflare deployment change.
          if printf '%s\n' "$files" | grep -Eq '^(frontend/|wrangler\.jsonc$)'; then
            cloudflare=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"

  deploy-supabase:
    name: Deploy Supabase Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "❌ Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy managed Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy ipsrs-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify Supabase deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "✅ Supabase backend deployment completed"

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.cloudflare == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker
        env:
          WORKER_URL: https://laporan-harian-ipsrs.rspc.workers.dev/
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/worker.html -w '%{http_code}' --max-time 30 "$WORKER_URL")" || code="000"
          if [ "$code" != "200" ]; then
            echo "❌ Cloudflare Worker smoke check failed: HTTP $code"
            exit 1
          fi
          echo "✅ Cloudflare Worker smoke check passed"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment smoke check
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/ipsrs-index.html -w '%{http_code}' --max-time 20 "$SITE_URL")" || code="000"
            if [ "$code" = "200" ] && grep -q "LAPORAN HARIAN IPSRS" /tmp/ipsrs-index.html; then
              echo "✅ GitHub Pages smoke check passed"
              exit 0
            fi
            sleep 10
          done
          echo "❌ GitHub Pages smoke check failed"
          exit 1

  production-result:
    name: Production Deployment Gate
    needs: [detect-changes, deploy-supabase, deploy-cloudflare, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Block failed production deployment
        if: ${{ needs.detect-changes.result != 'success' || needs.deploy-supabase.result == 'failure' || needs.deploy-supabase.result == 'cancelled' || needs.deploy-cloudflare.result == 'failure' || needs.deploy-cloudflare.result == 'cancelled' || needs.deploy-pages.result == 'failure' || needs.deploy-pages.result == 'cancelled' }}
        run: |
          echo "❌ IPSRS PRODUCTION DEPLOYMENT FAILED"
          echo "A required deployment target failed or was cancelled."
          exit 1

      - name: Deployment target summary
        run: |
          echo "Frontend/GitHub Pages: ${{ needs.detect-changes.outputs.frontend }}"
          echo "Supabase: ${{ needs.detect-changes.outputs.supabase }}"
          echo "Cloudflare Worker: ${{ needs.detect-changes.outputs.cloudflare }}"
          echo "Skipped targets are intentional when their source files did not change."

      - name: Production deployment passed
        run: echo "✅ IPSRS SELECTIVE PRODUCTION DEPLOYMENT PASSED"
