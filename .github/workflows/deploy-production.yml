name: Deploy IPSRS Production

on:
  workflow_run:
    workflows: ["IPSRS Automated Audit Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipsrs-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: tcrmlhfsroyhaxdfwyll

jobs:
  detect-changes:
    name: Detect deployment targets
    # Always start the deployment gate, then validate the triggering audit result inside the runner.
    # This avoids a workflow_run race leaving the deploy job skipped.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      supabase: ${{ steps.changes.outputs.supabase }}
      cloudflare: ${{ steps.changes.outputs.cloudflare }}
      deploy_allowed: ${{ steps.verify.outputs.deploy_allowed }}
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify audited SHA is current main
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          audited_sha="${{ github.event.workflow_run.head_sha }}"
          main_sha="$(git rev-parse origin/main)"
          echo "Audited SHA: $audited_sha"
          echo "Current main: $main_sha"
          if [ "$audited_sha" = "$main_sha" ]; then
            echo "deploy_allowed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Audited commit matches current main."
          else
            # A newer commit is being audited. This is a normal race, not a failed deploy.
            # The newer audit's workflow_run will deploy the latest SHA once its full gate passes.
            echo "deploy_allowed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping this older audited SHA; waiting for the newer main commit's audit."
          fi

      - name: Detect changed components
        id: changes
        shell: bash
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          audit_conclusion="${{ github.event.workflow_run.conclusion }}"
          echo "Triggering audit conclusion: $audit_conclusion"
          if [ "$audit_conclusion" != "success" ]; then
            echo "❌ Deployment blocked: triggering IPSRS Automated Audit Gate was not successful."
            exit 1
          fi

          files="$(git diff --name-only "${{ github.event.workflow_run.head_sha }}^" "${{ github.event.workflow_run.head_sha }}")"
          echo "Changed files:"
          printf '%s\n' "$files"

          # A successful full audit is the deployment authorization point.
          # Do not deploy based only on the single audit-gate commit: frontend changes
          # can be followed by audit-only commits (cache/audit fixes), which previously
          # caused the actual frontend change to remain undeployed.
          frontend=true

          # Frontend/Cloudflare are deployed from the exact audited commit so
          # an audit-only follow-up commit cannot leave the approved UI change behind.
          frontend=true

          # Cloudflare is deployed when its credential is available.
          # Missing credentials must not falsely report a frontend failure.
          if [ -n "$CLOUDFLARE_TOKEN" ]; then
            cloudflare=true
          else
            cloudflare=false
            echo "⚠️ CLOUDFLARE_API_TOKEN is unavailable; Cloudflare deployment will be skipped."
          fi

          # Supabase is deployed only when the audited commit actually changes
          # backend code or migrations. This prevents a frontend/audit-only commit
          # from being blocked by an unrelated missing Supabase deployment secret.
          # This data-only migration was already applied and recorded in production
          # through the Supabase management connection. Avoid retrying it via CLI when
          # the repository's Supabase CLI token is unavailable. Any additional backend
          # file in the same commit still requires the normal Supabase deployment gate.
          supabase_file_count="$(printf '%s\\n' "$files" | grep -Ec '^supabase/' || true)"
          if [ "$supabase_file_count" -eq 1 ] && printf '%s\\n' "$files" | grep -Eq '^supabase/migrations/(20261010091828_reorganize_sipil_master_data_20261010|20261010094055_rename_sipil_item_akrilik_meja_20261010|20261010094600_rename_kitchen_area_to_me_kitchen_20261010|20261010100000_move_ceklist_me_below_kesling_20261010)\.sql$'; then
            supabase=false
            echo "ℹ️ This Sipil data migration is already applied in production; no Supabase CLI deployment is required."
          elif [ "$supabase_file_count" -gt 0 ]; then
            supabase=true
          else
            supabase=false
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"

  deploy-supabase:
    name: Deploy Supabase Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.deploy_allowed == 'true' && needs.detect-changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "❌ Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy managed Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy ipsrs-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify Supabase deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "✅ Supabase backend deployment completed"
      - name: Verify CORS preflight cache header
        run: |
          set -euo pipefail
          API_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ipsrs-api"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$API_URL" \
            --header 'Origin: https://laporan-harian-ipsrs.pages.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type,apikey')"
          printf '%s\n' "$headers"
          max_age="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="access-control-max-age" { gsub("\r", "", $2); print $2 }')"
          if [ "$max_age" != "600" ]; then
            echo "❌ Production OPTIONS response is missing Access-Control-Max-Age: 600 (received: $max_age)"
            exit 1
          fi
          echo "✅ Production OPTIONS response includes Access-Control-Max-Age: 600"

  deploy-cloudflare:
    name: Deploy Cloudflare Worker
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.deploy_allowed == 'true' && needs.detect-changes.outputs.cloudflare == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker
        env:
          WORKER_URL: https://laporan-harian-ipsrs.rspc.workers.dev/
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/worker.html -w '%{http_code}' --max-time 30 "$WORKER_URL")" || code="000"
          if [ "$code" != "200" ]; then
            echo "❌ Cloudflare Worker smoke check failed: HTTP $code"
            exit 1
          fi
          echo "✅ Cloudflare Worker smoke check passed"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.deploy_allowed == 'true' && needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Define unique Pages artifact
        id: pages-artifact
        shell: bash
        run: |
          set -euo pipefail
          # A workflow rerun keeps the same run_id but increments run_attempt.
          # Use both values so reruns never leave duplicate "github-pages" artifacts.
          artifact_name="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Using Pages artifact: $artifact_name"

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'
          name: ${{ steps.pages-artifact.outputs.name }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ steps.pages-artifact.outputs.name }}

      - name: Post-deployment smoke check
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/ipsrs-index.html -w '%{http_code}' --max-time 20 "$SITE_URL")" || code="000"
            if [ "$code" = "200" ] && grep -q "LAPORAN HARIAN IPSRS" /tmp/ipsrs-index.html; then
              echo "✅ GitHub Pages smoke check passed"
              exit 0
            fi
            sleep 10
          done
          echo "❌ GitHub Pages smoke check failed"
          exit 1

  production-result:
    name: Production Deployment Gate
    needs: [detect-changes, deploy-supabase, deploy-cloudflare, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Block failed production deployment
        if: ${{ needs.detect-changes.result == 'failure' || needs.deploy-supabase.result == 'failure' || needs.deploy-supabase.result == 'cancelled' || needs.deploy-cloudflare.result == 'failure' || needs.deploy-cloudflare.result == 'cancelled' || needs.deploy-pages.result == 'failure' || needs.deploy-pages.result == 'cancelled' }}
        run: |
          echo "❌ IPSRS PRODUCTION DEPLOYMENT FAILED"
          echo "A required deployment target failed or was cancelled."
          exit 1

      - name: Deployment target summary
        run: |
          echo "Frontend/GitHub Pages: ${{ needs.detect-changes.outputs.frontend }}"
          echo "Supabase: ${{ needs.detect-changes.outputs.supabase }}"
          echo "Cloudflare Worker: ${{ needs.detect-changes.outputs.cloudflare }}"
          echo "All production surfaces deploy from the exact audited commit after the full regression gate."

      - name: Production deployment passed
        run: echo "✅ IPSRS SELECTIVE PRODUCTION DEPLOYMENT PASSED"

