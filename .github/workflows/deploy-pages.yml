name: Deploy IPSRS Frontend to GitHub Pages

on:
  workflow_run:
    workflows: ["IPSRS Automated Audit Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deployment smoke check
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking deployed site: $SITE_URL"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/ipsrs-index.html -w '%{http_code}' --max-time 20 "$SITE_URL")" || code="000"
            if [ "$code" = "200" ] && grep -q "LAPORAN HARIAN IPSRS" /tmp/ipsrs-index.html; then
              echo "✅ Post-deployment smoke check passed"
              exit 0
            fi
            echo "Attempt $attempt failed (HTTP $code); waiting 10s..."
            sleep 10
          done
          echo "❌ Post-deployment smoke check failed"
          exit 1
