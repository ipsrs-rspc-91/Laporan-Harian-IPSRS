name: Split IPSRS frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split frontend index into page files
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('frontend')
          src = root / 'index.html'
          html = src.read_text(encoding='utf-8')

          def extract_tag(source, tag, id_value):
              pat = re.compile(r'<(/?)' + re.escape(tag) + r'\b[^>]*>', re.I)
              wanted = re.compile(r'\bid=["\']' + re.escape(id_value) + r'["\']', re.I)
              start = None
              depth = 0
              for m in pat.finditer(source):
                  if not m.group(1):
                      if start is None:
                          if wanted.search(m.group(0)):
                              start = m.start()
                              depth = 1
                      else:
                          depth += 1
                  elif start is not None:
                      depth -= 1
                      if depth == 0:
                          return source[start:m.end()]
              raise RuntimeError(f'Element #{id_value} not found')

          legacy = root / '_legacy'
          legacy.mkdir(exist_ok=True)
          backup = legacy / 'index-original.html'
          if not backup.exists():
              backup.write_text(html, encoding='utf-8')

          style = re.search(r'<style\b[^>]*>(.*?)</style>', html, re.I | re.S)
          if not style:
              raise RuntimeError('Shared style block not found')
          css = root / 'css'
          css.mkdir(exist_ok=True)
          (css / 'style.css').write_text(style.group(1).strip() + '\n', encoding='utf-8')

          pages = root / 'pages'
          pages.mkdir(exist_ok=True)
          blocks = {
              'Page_Login.html': extract_tag(html, 'div', 'loginScreen'),
              'Page_Input.html': extract_tag(html, 'section', 'page-input'),
              'Page_Dashboard.html': extract_tag(html, 'section', 'page-dashboard'),
              'Page_Laporan.html': extract_tag(html, 'section', 'page-laporan'),
          }
          for name, content in blocks.items():
              (pages / name).write_text(content + '\n', encoding='utf-8')

          body_match = re.search(r'<body\b[^>]*>(.*?)</body>', html, re.I | re.S)
          if not body_match:
              raise RuntimeError('Body not found')
          body = body_match.group(1)
          replacements = {
              blocks['Page_Login.html']: '<div id="loginScreen" class="hidden"></div>',
              blocks['Page_Input.html']: '<section id="page-input" class="page active"></section>',
              blocks['Page_Dashboard.html']: '<section id="page-dashboard" class="page"></section>',
              blocks['Page_Laporan.html']: '<section id="page-laporan" class="page"></section>',
          }
          for old, new in replacements.items():
              body = body.replace(old, new, 1)

          head_prefix = html[:html.find('<style')]
          after_style = html[style.end():]
          head_end = after_style.lower().find('</head>')
          if head_end < 0:
              raise RuntimeError('Head end not found')
          head_tail = after_style[:head_end]
          new_head = head_prefix + '<link rel="stylesheet" href="css/style.css">\n' + head_tail + '</head>'

          loader = '''
  <script>
  (async function(){
    const mounts = {
      loginScreen: 'pages/Page_Login.html',
      'page-input': 'pages/Page_Input.html',
      'page-dashboard': 'pages/Page_Dashboard.html',
      'page-laporan': 'pages/Page_Laporan.html'
    };
    try {
      await Promise.all(Object.entries(mounts).map(async ([id, url]) => {
        const el = document.getElementById(id);
        if (!el) throw new Error('Mount point not found: ' + id);
        const res = await fetch(url, {cache:'no-store'});
        if (!res.ok) throw new Error('Gagal memuat ' + url + ' (' + res.status + ')');
        el.outerHTML = await res.text();
      }));
      const script = document.createElement('script');
      script.src = 'app.js';
      document.body.appendChild(script);
    } catch (err) {
      console.error(err);
      const loading = document.querySelector('.auth-loading-text');
      if (loading) loading.textContent = 'Gagal memuat aplikasi. Silakan muat ulang halaman.';
    }
  })();
  </script>
'''

          src.write_text(new_head + '<body>' + body + loader + '</body>\n</html>\n', encoding='utf-8')
          print('Frontend split completed successfully.')

      - name: Commit split files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html frontend/css/style.css frontend/pages frontend/_legacy/index-original.html
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: split IPSRS frontend into page files'
          git push

      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/split-ipsrs-frontend.yml
          git commit -m 'chore: remove one-time frontend split workflow'
          git push
