name: Finalize IPSRS split

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize split
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('frontend')
          html = (root/'index.html').read_text(encoding='utf-8')

          # 1) Move the large static master data block out of index.html.
          m = re.search(r'<script>\s*(const STATIC_KATEGORI\s*=.*?\n\s*const ITEMS_BY_AREA\s*=.*?\n\s*\};)\s*</script>', html, re.S)
          if not m:
              raise SystemExit('STATIC_DATA_NOT_FOUND')
          (root/'js').mkdir(exist_ok=True)
          (root/'js'/'static-data.js').write_text(m.group(1).strip()+'\n', encoding='utf-8')
          html = html[:m.start()] + html[m.end():]

          # 2) Move report modals to the report page so report-related markup
          # stays together. Password modal remains global in index.html.
          pages = root/'pages'
          report = pages/'Page_Laporan.html'
          blocks=[]
          for name in ['EDIT LAPORAN','TAMBAH KATEGORI','TAMBAH AREA KERJA','TAMBAH ITEM','KONFIRMASI SIMPAN']:
              sm = re.search(r'\s*<!-- ===================== MODAL: '+re.escape(name)+r' ===================== -->', html, re.I)
              if not sm: raise SystemExit('MODAL_NOT_FOUND_'+name)
              tail=html[sm.end():]
              nm=re.search(r'\s*<!-- ===================== MODAL: |\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/Chart\.js', tail, re.I)
              if not nm: raise SystemExit('MODAL_END_NOT_FOUND_'+name)
              blocks.append(html[sm.start():sm.end()+nm.start()].strip())
              html=html[:sm.start()]+html[sm.end()+nm.start():]
          report.write_text(report.read_text(encoding='utf-8').rstrip()+'\n\n'+'\n\n'.join(blocks)+'\n', encoding='utf-8')

          # 3) Remove legacy dependency tags and the previous loader.
          html=re.sub(r'\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/Chart\.js/4\.4\.0/chart\.umd\.min\.js"></script>', '', html)
          html=re.sub(r'\s*<script src="\./config\.js"></script>', '', html)
          html=re.sub(r'\s*<script src="\./app\.js"></script>', '', html)
          html=re.sub(r'\s*<script>\s*\(async function\(\)\{.*?\}\)\(\);\s*</script>\s*', '\n', html, flags=re.S)

          # 4) One bootstrap: fragments in parallel, then static-data, Chart.js,
          # config, and finally app.js in dependency order.
          loader='''\n  <script>\n  (async function(){\n    const mounts={loginScreen:'pages/Page_Login.html','page-input':'pages/Page_Input.html','page-dashboard':'pages/Page_Dashboard.html','page-laporan':'pages/Page_Laporan.html'};\n    async function fragment(id,url){\n      const el=document.getElementById(id); if(!el) throw new Error('Mount point not found: '+id);\n      const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('Gagal memuat '+url+' ('+r.status+')');\n      el.outerHTML=await r.text();\n    }\n    function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Gagal memuat '+src));document.body.appendChild(s);});}\n    try{\n      await Promise.all(Object.entries(mounts).map(([id,url])=>fragment(id,url)));\n      await script('js/static-data.js');\n      await script('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js');\n      await script('./config.js');\n      await script('./app.js');\n    }catch(e){console.error(e);const t=document.querySelector('.auth-loading-text');if(t)t.textContent='Gagal memuat aplikasi. Silakan muat ulang halaman.';}\n  })();\n  </script>\n'''
          html=html.replace('</body>',loader+'</body>')
          (root/'index.html').write_text(html,encoding='utf-8')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html frontend/pages/Page_Laporan.html frontend/js/static-data.js
          git diff --cached --quiet || git commit -m 'refactor: finalize IPSRS frontend split'
          git push
          git rm -f .github/workflows/zz-finalize.yml
          git commit -m 'chore: remove one-time split workflow'
          git push
