name: LHI Discipline Unit Tests

on:
  push:
    branches:
      - repair/lhi-status-separation-20261103
    paths:
      - "supabase/functions/ipsrs-api/lhi-discipline.mjs"
      - "tests/lhi-discipline.test.mjs"
      - "tests/lhi-schema-draft.test.mjs"
      - "tests/lhi-scheduler-draft.test.mjs"
      - "tests/lhi-atomic-reset-draft.test.mjs"
      - "docs/drafts/2026-11-03-lhi-atomic-reset-grace-v2-review.sql"
      - "docs/drafts/2026-11-03-lhi-scheduler-v2-review.sql"
      - "docs/drafts/2026-11-03-lhi-schema-v2-migration-review.sql"
      - "supabase/functions/ipsrs-api/recovery-policy.mjs"
      - "supabase/functions/lhi-reset-verify/index.ts"
      - "supabase/functions/lhi-recovery-exchange/index.ts"
      - "supabase/migrations/20261103120000_lhi_restricted_recovery_challenges.sql"
      - "supabase/config.toml"
      - ".github/workflows/lhi-discipline-tests.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "supabase/functions/ipsrs-api/lhi-discipline.mjs"
      - "tests/lhi-discipline.test.mjs"

permissions:
  contents: read

jobs:
  lhi-discipline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run LHI discipline unit tests
        run: node --test tests/lhi-discipline.test.mjs tests/lhi-schema-draft.test.mjs tests/lhi-scheduler-draft.test.mjs tests/lhi-atomic-reset-draft.test.mjs
