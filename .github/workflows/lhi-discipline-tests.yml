name: LHI Discipline and Recovery Tests

on:
  push:
    branches:
      - repair/lhi-status-separation-20261103
    paths:
      - "frontend/app.js"
      - "frontend/login-fast.js"
      - "supabase/config.toml"
      - "supabase/functions/ipsrs-api/**"
      - "supabase/functions/lhi-block-status/**"
      - "supabase/functions/lhi-reset-verify/**"
      - "supabase/functions/lhi-recovery-exchange/**"
      - "supabase/functions/lhi-recovery-action/**"
      - "supabase/migrations/**"
      - "docs/drafts/*lhi*.sql"
      - "tests/lhi-*.test.mjs"
      - ".github/workflows/lhi-discipline-tests.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "frontend/app.js"
      - "frontend/login-fast.js"
      - "supabase/config.toml"
      - "supabase/functions/ipsrs-api/**"
      - "supabase/functions/lhi-block-status/**"
      - "supabase/functions/lhi-reset-verify/**"
      - "supabase/functions/lhi-recovery-exchange/**"
      - "supabase/functions/lhi-recovery-action/**"
      - "supabase/migrations/**"
      - "docs/drafts/*lhi*.sql"
      - "tests/lhi-*.test.mjs"
      - ".github/workflows/lhi-discipline-tests.yml"

permissions:
  contents: read

jobs:
  lhi-discipline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/login-fast.js
      - name: Run LHI discipline and recovery unit tests
        run: node --test tests/lhi-*.test.mjs
