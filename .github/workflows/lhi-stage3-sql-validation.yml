name: LHI Stage 3 SQL Validation

on:
  pull_request:
    branches: [main, stage2-backend-recovery-security]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/ipsrs-api/index.ts"
      - "scripts/validate-lhi-stage3.py"
      - ".github/workflows/lhi-stage3-sql-validation.yml"
  push:
    branches: [stage3-created-at-monitoring]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/ipsrs-api/index.ts"
      - "scripts/validate-lhi-stage3.py"
      - ".github/workflows/lhi-stage3-sql-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: PostgreSQL syntax + Stage 3 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Validate migrations and monitoring contract
        run: python scripts/validate-lhi-stage3.py
      - name: Validate Edge Function TypeScript syntax
        run: npx --yes esbuild supabase/functions/ipsrs-api/index.ts --bundle --format=esm --external:npm:* --outfile=/tmp/ipsrs-api-stage3.js
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/app.js
