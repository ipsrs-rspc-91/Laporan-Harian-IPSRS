name: IPSRS Automated Audit Gate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipsrs-audit-commit-${{ github.sha }}
  cancel-in-progress: true

jobs:
  audit-total:
    name: Audit Total + Static Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run IPSRS Automated Audit
        run: node scripts/audit-total.mjs
      - name: Setup Deno for Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check LHI Edge Functions
        run: |
          set -euo pipefail
          deno check supabase/functions/lhi-reset-verify/index.ts
          deno check supabase/functions/lhi-block-status/index.ts
          deno check supabase/functions/lhi-recovery-exchange/index.ts
          deno check supabase/functions/lhi-recovery-action/index.ts
      - name: Upload static audit checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipsrs-audit-static-${{ github.sha }}
          path: audit-output/
          retention-days: 30

  browser-regression:
    name: Browser Smoke Regression
    needs: audit-total
    if: needs.audit-total.result == 'success'
    # Playwright 1.55 does not support the ubuntu-latest image currently resolving to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipsrs-browser-regression-${{ github.sha }}
          path: |
            audit-output/
            test-results/
          retention-days: 30

  postgres-lhi-regression:
    name: PostgreSQL LHI Grace + Recovery Regression
    needs: audit-total
    if: needs.audit-total.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipsrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipsrs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase-like schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ipsrs_test -v ON_ERROR_STOP=1 -f tests/sql/lhi-test-fixture.sql
      - name: Apply recovery challenge prerequisite migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ipsrs_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261104103000_lhi_recovery_expired_incident_fix.sql
      - name: Apply LHI Form Blok alignment migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ipsrs_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261115120000_lhi_form_block_compliance_alignment.sql
      - name: Run LHI grace, recovery, void, idempotency and RLS acceptance tests
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ipsrs_test -v ON_ERROR_STOP=1 -f tests/sql/lhi-grace-acceptance.sql

  audit-gate-result:
    name: Deployment Gate
    needs: [audit-total, browser-regression, postgres-lhi-regression]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Block when audit or browser regression fails
        if: needs.audit-total.result != 'success' || needs.browser-regression.result != 'success' || needs.postgres-lhi-regression.result != 'success'
        run: |
          echo "❌ IPSRS DEPLOYMENT GATE BLOCKED"
          echo "Static audit, browser regression, atau PostgreSQL LHI regression menemukan masalah."
          exit 1
      - name: Full gate passed
        if: needs.audit-total.result == 'success' && needs.browser-regression.result == 'success'
        run: echo "✅ IPSRS FULL REGRESSION GATE PASSED"

